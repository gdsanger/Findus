<div class="findus-card">
    <div class="findus-checklist-progress">
        <div class="d-flex justify-content-between small text-muted mb-1">
            <span>Fortschritt</span>
            <span>{{ done_count }}/{{ total_count }} erledigt</span>
        </div>
        <div
            class="progress"
            role="progressbar"
            aria-label="Checklisten-Fortschritt"
            aria-valuenow="{{ done_count }}"
            aria-valuemin="0"
            aria-valuemax="{{ total_count }}"
        >
            <div class="progress-bar" style="width: {{ progress_percent }}%;"></div>
        </div>
    </div>

    <ul class="list-group list-group-flush mb-2">
        {% for item in checklist_items %}
        <li class="list-group-item d-flex align-items-center gap-2 bg-transparent">
            <form
                method="post"
                action="{% url 'documents:checklist_item_toggle' task.pk item.pk %}"
                hx-post="{% url 'documents:checklist_item_toggle' task.pk item.pk %}"
                hx-target="#task-checklist"
                hx-swap="innerHTML"
            >
                {% csrf_token %}
                <button type="submit" class="btn btn-sm btn-outline-secondary" aria-label="Erledigt umschalten">
                    {% if item.is_done %}✓{% else %}○{% endif %}
                </button>
            </form>

            <form
                class="flex-grow-1"
                method="post"
                action="{% url 'documents:checklist_item_update' task.pk item.pk %}"
                hx-post="{% url 'documents:checklist_item_update' task.pk item.pk %}"
                hx-target="#task-checklist"
                hx-swap="innerHTML"
            >
                {% csrf_token %}
                <input
                    type="text"
                    name="text"
                    value="{{ item.text }}"
                    aria-label="Text bearbeiten"
                    class="form-control form-control-sm {% if item.is_done %}text-decoration-line-through text-muted{% endif %}"
                >
            </form>

            <div class="findus-checklist-order-actions">
                <form
                    method="post"
                    action="{% url 'documents:checklist_item_move' task.pk item.pk 'up' %}"
                    hx-post="{% url 'documents:checklist_item_move' task.pk item.pk 'up' %}"
                    hx-target="#task-checklist"
                    hx-swap="innerHTML"
                >
                    {% csrf_token %}
                    <button type="submit" class="btn btn-sm btn-outline-secondary" aria-label="Nach oben verschieben" {% if forloop.first %}disabled{% endif %}>↑</button>
                </form>
                <form
                    method="post"
                    action="{% url 'documents:checklist_item_move' task.pk item.pk 'down' %}"
                    hx-post="{% url 'documents:checklist_item_move' task.pk item.pk 'down' %}"
                    hx-target="#task-checklist"
                    hx-swap="innerHTML"
                >
                    {% csrf_token %}
                    <button type="submit" class="btn btn-sm btn-outline-secondary" aria-label="Nach unten verschieben" {% if forloop.last %}disabled{% endif %}>↓</button>
                </form>
            </div>

            <form
                method="post"
                action="{% url 'documents:checklist_item_delete' task.pk item.pk %}"
                hx-post="{% url 'documents:checklist_item_delete' task.pk item.pk %}"
                hx-target="#task-checklist"
                hx-swap="innerHTML"
            >
                {% csrf_token %}
                <button type="submit" class="btn btn-sm btn-outline-danger">Entfernen</button>
            </form>
        </li>
        {% empty %}
        <li class="list-group-item bg-transparent text-muted">Keine Einträge.</li>
        {% endfor %}
    </ul>
    <form
        class="d-flex gap-2"
        method="post"
        action="{% url 'documents:checklist_item_add' task.pk %}"
        hx-post="{% url 'documents:checklist_item_add' task.pk %}"
        hx-target="#task-checklist"
        hx-swap="innerHTML"
    >
        {% csrf_token %}
        <input type="text" name="text" class="form-control form-control-sm" placeholder="Neuer Schritt …">
        <button type="submit" class="btn btn-sm btn-outline-secondary text-nowrap">+ Hinzufügen</button>
    </form>
</div>
