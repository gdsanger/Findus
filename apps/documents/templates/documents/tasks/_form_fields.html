{% if task is None %}
<div class="findus-task-form-section">
    <h3 class="findus-section-subtitle">Vorlage</h3>
    <div class="findus-task-form-group">
        <label class="form-label" for="task-template-select">Aus Vorlage anlegen</label>
        <select
            id="task-template-select"
            name="template"
            class="form-select form-select-sm"
            hx-get="{% url 'documents:task_template_prefill' %}"
            hx-target="#task-form-dynamic"
            hx-swap="innerHTML"
            hx-include="this"
        >
            <option value="">– Keine Vorlage –</option>
            {% for template in task_templates %}
            <option value="{{ template.id }}" {% if template.id == selected_template_id %}selected{% endif %}>{{ template.name }}</option>
            {% endfor %}
        </select>
    </div>
</div>
{% endif %}

<div id="task-form-dynamic">
    {% include "documents/tasks/partials/_form_dynamic_fields.html" %}
</div>

<div class="findus-task-form-section">
    <h3 class="findus-section-subtitle">Verknüpfte Dokumente</h3>
    <div class="findus-task-documents">
        <input
            type="search"
            class="form-control form-control-sm"
            placeholder="Dokumente durchsuchen …"
            aria-label="Dokumente durchsuchen"
            data-task-document-filter
        >
        <div class="findus-task-document-list" data-task-document-list>
            {% for document in all_documents %}
            <div class="form-check" data-document-title="{{ document.title|lower }}">
                <input
                    type="checkbox"
                    class="form-check-input"
                    name="documents"
                    value="{{ document.id }}"
                    id="task-document-{{ document.id }}"
                    {% if document.id in selected_document_ids %}checked{% endif %}
                >
                <label class="form-check-label" for="task-document-{{ document.id }}">{{ document.title }}</label>
            </div>
            {% empty %}
            <p class="text-muted mb-0">Keine Dokumente vorhanden.</p>
            {% endfor %}
        </div>
    </div>
</div>
