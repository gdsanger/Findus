<form
    class="findus-filter-bar"
    hx-get="{{ list_url }}"
    hx-target="#document-list-region"
    hx-swap="innerHTML"
    hx-trigger="submit, change, findus:documents-changed from:body"
    hx-push-url="true"
    hx-indicator="#document-list-indicator"
>
    {% if show_search %}
    <div class="findus-filter-field findus-search-field">
        <label class="form-label" for="filter-q">Suche</label>
        <input
            type="search"
            id="filter-q"
            name="q"
            class="form-control form-control-sm"
            placeholder="Dokumente semantisch durchsuchen …"
            value="{{ search_query }}"
            autocomplete="off"
        >
    </div>
    {% endif %}
    {% if show_correspondent %}
    <div class="findus-filter-field">
        <label class="form-label" for="filter-correspondent">Kontakt</label>
        <select id="filter-correspondent" name="correspondent" class="form-select form-select-sm">
            <option value="">Alle</option>
            {% for correspondent in correspondents %}
            <option value="{{ correspondent.id }}" {% if selected.correspondent == correspondent.id|stringformat:"s" %}selected{% endif %}>{{ correspondent.name }}</option>
            {% endfor %}
        </select>
    </div>
    {% endif %}
    {% if show_vorgang_filter %}
    <div class="findus-filter-field">
        <label class="form-label" for="filter-vorgang">Vorgang</label>
        <select id="filter-vorgang" name="vorgang" class="form-select form-select-sm">
            <option value="">Alle</option>
            {% for vorgang in vorgaenge %}
            <option value="{{ vorgang.id }}" {% if selected.vorgang == vorgang.id|stringformat:"s" %}selected{% endif %}>{{ vorgang.name }}</option>
            {% endfor %}
        </select>
    </div>
    {% endif %}
    {% if show_tag_filter|default:True %}
    <div class="findus-filter-field">
        <label class="form-label" for="filter-tag">Tag</label>
        <select id="filter-tag" name="tag" class="form-select form-select-sm">
            <option value="">Alle</option>
            {% for tag in tags %}
            <option value="{{ tag.id }}" {% if selected.tag == tag.id|stringformat:"s" %}selected{% endif %}>{{ tag }}</option>
            {% endfor %}
        </select>
    </div>
    {% endif %}
    <div class="findus-filter-field">
        <label class="form-label" for="filter-status">Status</label>
        <select id="filter-status" name="status" class="form-select form-select-sm">
            <option value="">Alle</option>
            {% for value, label in status_choices %}
            <option value="{{ value }}" {% if selected.status == value %}selected{% endif %}>{{ label }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="findus-filter-field">
        <label class="form-label" for="filter-direction">Richtung</label>
        <select id="filter-direction" name="direction" class="form-select form-select-sm">
            <option value="">Alle</option>
            {% for value, label in direction_choices %}
            <option value="{{ value }}" {% if selected.direction == value %}selected{% endif %}>{{ label }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="findus-filter-field">
        <label class="form-label" for="filter-sphere">Sphäre</label>
        <select id="filter-sphere" name="sphere" class="form-select form-select-sm">
            <option value="">Alle</option>
            {% for value, label in sphere_choices %}
            <option value="{{ value }}" {% if selected.sphere == value %}selected{% endif %}>{{ label }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="findus-filter-field">
        <label class="form-label" for="filter-action-status">Erledigung</label>
        <select id="filter-action-status" name="action_status" class="form-select form-select-sm">
            <option value="">Alle</option>
            {% for value, label in action_status_choices %}
            <option value="{{ value }}" {% if selected.action_status == value %}selected{% endif %}>{{ label }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="findus-filter-field">
        <span class="form-label d-block">Ansicht</span>
        <div class="btn-group btn-group-sm findus-view-toggle" role="group" aria-label="Ansicht wählen">
            <input type="hidden" name="view" id="filter-view" value="{{ selected.view }}">
            <button
                type="button"
                class="btn btn-outline-secondary findus-view-toggle-btn{% if selected.view != "timeline" %} active{% endif %}"
                data-view-value=""
                aria-pressed="{% if selected.view != "timeline" %}true{% else %}false{% endif %}"
            >Liste</button>
            <button
                type="button"
                class="btn btn-outline-secondary findus-view-toggle-btn{% if selected.view == "timeline" %} active{% endif %}"
                data-view-value="timeline"
                aria-pressed="{% if selected.view == "timeline" %}true{% else %}false{% endif %}"
            >Timeline</button>
        </div>
    </div>
    <div class="findus-filter-field findus-filter-actions">
        <button type="button" id="filter-reset" class="btn btn-sm btn-outline-secondary">
            Filter zurücksetzen
        </button>
    </div>
    <span id="document-list-indicator" class="htmx-indicator findus-filter-loading">Lädt …</span>
</form>
<script>
// Liste/Timeline-Umschalter (#1087): ein verstecktes `view`-Feld im Filter-
// Formular statt einer eigenen Navigation, damit ein Klick dieselbe
// hx-get/hx-push-url-Mechanik wie jedes andere Filterfeld auslöst -- die
// aktuell gesetzten Filter (#1039) bleiben also automatisch erhalten.
// Der Sync der aktiven Schaltfläche läuft über `htmx:afterSwap` auf der
// Ergebnisliste statt direkt im Klick-Handler, weil dieselbe Stelle auch den
// Fall abdeckt, in dem Home die Ansicht aus localStorage wiederherstellt
// (setzt den Hidden-Wert direkt, ohne über den Button-Klick zu laufen).
(function () {
    var form = document.querySelector(".findus-filter-bar");
    var toggle = form ? form.querySelector(".findus-view-toggle") : null;
    var hidden = toggle ? toggle.querySelector("input[name='view']") : null;
    var region = document.getElementById("document-list-region");
    if (!form || !toggle || !hidden) {
        return;
    }

    function syncButtons() {
        var current = hidden.value || "";
        toggle.querySelectorAll(".findus-view-toggle-btn").forEach(function (btn) {
            var isActive = (btn.dataset.viewValue || "") === current;
            btn.classList.toggle("active", isActive);
            btn.setAttribute("aria-pressed", isActive ? "true" : "false");
        });
    }

    toggle.addEventListener("click", function (event) {
        var btn = event.target.closest(".findus-view-toggle-btn");
        if (!btn || hidden.value === (btn.dataset.viewValue || "")) {
            return;
        }
        hidden.value = btn.dataset.viewValue || "";
        syncButtons();
        hidden.dispatchEvent(new Event("change", { bubbles: true }));
    });

    if (region) {
        region.addEventListener("htmx:afterSwap", syncButtons);
    }
})();
</script>
