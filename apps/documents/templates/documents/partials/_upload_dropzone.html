<form
    id="upload-dropzone"
    class="findus-upload-dropzone"
    hx-post="{{ upload_url }}"
    hx-encoding="multipart/form-data"
    hx-trigger="change from:#upload-input"
    hx-target="#upload-feedback"
    hx-swap="innerHTML"
    hx-indicator="#upload-indicator"
>
    <p class="findus-upload-hint">
        Dateien hierher ziehen oder
        <button type="button" class="btn btn-sm btn-primary" onclick="document.getElementById('upload-input').click()">
            Hochladen
        </button>
    </p>
    <p class="findus-upload-constraints text-muted">
        Erlaubt: {{ upload_allowed_extensions|join:", "|upper }} · max. {{ upload_max_size_mb|floatformat:"0" }} MB je Datei
    </p>
    <input
        type="file"
        id="upload-input"
        name="files"
        multiple
        accept="{% for ext in upload_allowed_extensions %}.{{ ext }}{% if not forloop.last %},{% endif %}{% endfor %}"
        class="visually-hidden"
    >
    <span id="upload-indicator" class="htmx-indicator findus-filter-loading">Wird hochgeladen …</span>
</form>
<div id="upload-feedback" class="findus-upload-feedback" aria-live="polite"></div>
