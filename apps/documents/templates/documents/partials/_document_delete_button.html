<form
    method="post"
    action="{% url 'documents:delete' document.pk %}"
    class="d-inline"
    onsubmit="return confirm('Dokument „{{ document.title }}“ wirklich löschen? Original und indizierte Inhalte werden entfernt.');"
>
    {% csrf_token %}
    <button type="submit" class="btn btn-sm btn-outline-danger">Löschen</button>
</form>
