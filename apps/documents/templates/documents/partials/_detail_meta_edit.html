<div class="findus-card findus-detail-meta">
    <form
        hx-post="{% url 'documents:meta' document.pk %}"
        hx-target="#document-meta"
        hx-swap="innerHTML"
    >
        <div class="findus-detail-meta-edit-fields">
            <div class="findus-filter-field">
                <label class="form-label" for="meta-correspondent">Kontakt</label>
                <select id="meta-correspondent" name="correspondent" class="form-select form-select-sm">
                    <option value="">— kein Kontakt —</option>
                    {% for correspondent in all_correspondents %}
                    <option value="{{ correspondent.id }}" {% if correspondent.id == selected_correspondent_id %}selected{% endif %}>{{ correspondent.name }}</option>
                    {% endfor %}
                </select>
                <div class="findus-quick-create" id="quick-create-correspondent">
                    <input type="text" name="correspondent_name" class="form-control form-control-sm {% if quick_create_error.kind == 'correspondent' %}is-invalid{% endif %}" placeholder="Neuer Kontakt …">
                    <button
                        type="button"
                        class="btn btn-sm btn-outline-secondary"
                        hx-post="{% url 'documents:meta_quick_create' document.pk 'correspondent' %}"
                        hx-include="#quick-create-correspondent"
                        hx-target="#document-meta"
                        hx-swap="innerHTML"
                    >+ Anlegen</button>
                    {% if quick_create_error.kind == 'correspondent' %}
                    <div class="findus-quick-create-error text-danger small">{{ quick_create_error.message }}</div>
                    {% endif %}
                </div>
            </div>
            <div class="findus-filter-field">
                <label class="form-label" for="meta-direction">Richtung</label>
                <select id="meta-direction" name="direction" class="form-select form-select-sm">
                    {% for value, label in direction_choices %}
                    <option value="{{ value }}" {% if value == document.direction %}selected{% endif %}>{{ label }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="findus-filter-field">
                <label class="form-label" for="meta-vorgaenge">Vorgänge</label>
                <select id="meta-vorgaenge" name="vorgaenge" class="form-select form-select-sm" multiple size="4">
                    {% for vorgang in all_vorgaenge %}
                    <option value="{{ vorgang.id }}" {% if vorgang.id in selected_vorgang_ids %}selected{% endif %}>{{ vorgang.name }}</option>
                    {% endfor %}
                </select>
                <div class="findus-quick-create" id="quick-create-vorgang">
                    <input type="text" name="vorgang_name" class="form-control form-control-sm {% if quick_create_error.kind == 'vorgang' %}is-invalid{% endif %}" placeholder="Neuer Vorgang …">
                    <button
                        type="button"
                        class="btn btn-sm btn-outline-secondary"
                        hx-post="{% url 'documents:meta_quick_create' document.pk 'vorgang' %}"
                        hx-include="#quick-create-vorgang"
                        hx-target="#document-meta"
                        hx-swap="innerHTML"
                    >+ Anlegen</button>
                    {% if quick_create_error.kind == 'vorgang' %}
                    <div class="findus-quick-create-error text-danger small">{{ quick_create_error.message }}</div>
                    {% endif %}
                </div>
            </div>
            <div class="findus-filter-field">
                <label class="form-label" for="meta-tags">Tags</label>
                <select id="meta-tags" name="tags" class="form-select form-select-sm" multiple size="4">
                    {% for tag in all_tags %}
                    <option value="{{ tag.id }}" {% if tag.id in selected_tag_ids %}selected{% endif %}>{{ tag }}</option>
                    {% endfor %}
                </select>
                <div class="findus-quick-create" id="quick-create-tag">
                    <input type="text" name="tag_name" class="form-control form-control-sm {% if quick_create_error.kind == 'tag' %}is-invalid{% endif %}" placeholder="Neues Tag …">
                    <input type="text" name="tag_dimension" class="form-control form-control-sm" placeholder="Dimension (optional)">
                    <button
                        type="button"
                        class="btn btn-sm btn-outline-secondary"
                        hx-post="{% url 'documents:meta_quick_create' document.pk 'tag' %}"
                        hx-include="#quick-create-tag"
                        hx-target="#document-meta"
                        hx-swap="innerHTML"
                    >+ Anlegen</button>
                    {% if quick_create_error.kind == 'tag' %}
                    <div class="findus-quick-create-error text-danger small">{{ quick_create_error.message }}</div>
                    {% endif %}
                </div>
            </div>
        </div>
        <div class="findus-detail-meta-edit-actions">
            <button type="submit" class="btn btn-sm btn-primary">Speichern</button>
            <button
                type="button"
                class="btn btn-sm btn-outline-secondary"
                hx-get="{% url 'documents:meta' document.pk %}"
                hx-target="#document-meta"
                hx-swap="innerHTML"
            >
                Abbrechen
            </button>
        </div>
    </form>
</div>
