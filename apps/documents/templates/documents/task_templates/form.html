{% extends "base.html" %}
{% block title %}Neue Aufgaben-Vorlage – Findus{% endblock %}
{% block content %}
{% include "partials/_content_header.html" with page_title="Neue Aufgaben-Vorlage" %}

<section class="findus-section">
    <form method="post" class="findus-card findus-task-form">
        {% csrf_token %}
        {% include "documents/task_templates/_form_fields.html" %}
        <div class="findus-detail-meta-edit-actions">
            <button type="submit" class="btn btn-sm btn-primary">Anlegen</button>
            <a href="{% url 'documents:task_template_list' %}" class="btn btn-sm btn-outline-secondary">Abbrechen</a>
        </div>
    </form>
</section>
{% endblock %}
