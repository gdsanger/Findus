<!DOCTYPE html>
<html lang="de" xmlns="http://www.w3.org/1999/xhtml" xmlns:v="urn:schemas-microsoft-com:vml" xmlns:o="urn:schemas-microsoft-com:office:office">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="color-scheme" content="light">
<meta name="supported-color-schemes" content="light">
<meta name="x-apple-disable-message-reformatting">
<!--[if mso]>
<noscript>
<xml>
<o:OfficeDocumentSettings>
<o:PixelsPerInch>96</o:PixelsPerInch>
</o:OfficeDocumentSettings>
</xml>
</noscript>
<style>
table, td { mso-table-lspace: 0pt; mso-table-rspace: 0pt; }
</style>
<![endif]-->
<style>
  body, table, td, a { -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }
  img { -ms-interpolation-mode: bicubic; border: 0; line-height: 100%; outline: none; text-decoration: none; }
  body { margin: 0; padding: 0; width: 100% !important; background-color: #f2f0ed; }
  @media only screen and (max-width: 620px) {
    .findus-email-container { width: 100% !important; }
    .findus-email-padded { padding-left: 16px !important; padding-right: 16px !important; }
  }
</style>
</head>
<body style="margin:0; padding:0; background-color:#f2f0ed;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f2f0ed;">
<tr>
<td align="center" style="padding:24px 12px;">
<table role="presentation" class="findus-email-container" width="600" cellpadding="0" cellspacing="0" border="0" style="width:600px; max-width:600px; background-color:#ffffff; border:1px solid #e3e1dd; border-radius:8px;">
<tr>
<td class="findus-email-padded" style="padding:28px 32px 20px 32px; border-bottom:1px solid #e3e1dd;">
{% block header %}
<span style="font-family:Arial,Helvetica,sans-serif; font-size:22px; font-weight:bold; color:#b35d3d; letter-spacing:0.3px;">Findus</span>
{% endblock %}
</td>
</tr>
<tr>
<td class="findus-email-padded" style="padding:28px 32px; font-family:Arial,Helvetica,sans-serif; font-size:15px; line-height:1.5; color:#2b2a28;">
{% block content %}{% endblock %}
</td>
</tr>
<tr>
<td class="findus-email-padded" style="padding:20px 32px 28px 32px; border-top:1px solid #e3e1dd; font-family:Arial,Helvetica,sans-serif; font-size:12px; line-height:1.5; color:#6b6965;">
<p style="margin:0 0 4px 0;">Findus</p>
<p style="margin:0;">{% block footer_reason %}Du erhältst diese Nachricht von Findus.{% endblock %}</p>
</td>
</tr>
</table>
</td>
</tr>
</table>
</body>
</html>
