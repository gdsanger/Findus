{# Reusable content-layout header: title + optional action row.
   Include with a page_title (and optional page_actions) context variable. #}
<div class="findus-page-header">
    <h1 class="findus-page-title">{{ page_title }}</h1>
    {% if page_actions %}
    <div class="findus-page-actions">{{ page_actions }}</div>
    {% endif %}
</div>
