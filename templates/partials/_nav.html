{% load static %}
<a href="{% url 'documents:home' %}" class="findus-brand">
    <img src="{% static 'images/findus-logo.png' %}" alt="Findus" class="findus-brand-logo">
</a>
<form method="get" action="{% url 'documents:home' %}" class="findus-nav-search" role="search">
    <input
        type="search"
        name="q"
        class="form-control form-control-sm"
        placeholder="Suchen …"
        aria-label="Dokumente durchsuchen"
        value="{% if request.resolver_match.url_name == 'home' %}{{ request.GET.q }}{% endif %}"
    >
</form>
<ul class="findus-nav-list">
    <li>
        <a
            href="{% url 'documents:dashboard' %}"
            class="findus-nav-link{% if request.resolver_match.url_name == 'dashboard' %} active{% endif %}"
        >
            Dashboard
        </a>
    </li>
    <li>
        <a
            href="{% url 'documents:home' %}"
            class="findus-nav-link{% if request.resolver_match.url_name == 'home' and not request.GET.action_status %} active{% endif %}"
        >
            Dokumente
        </a>
    </li>
    <li>
        <a
            href="{% url 'documents:home' %}?action_status=offen"
            class="findus-nav-link{% if request.resolver_match.url_name == 'home' and request.GET.action_status == 'offen' %} active{% endif %}"
        >
            Zu erledigen
            {% if open_action_status_count %}
            <span class="badge text-bg-warning findus-nav-badge">{{ open_action_status_count }}</span>
            {% endif %}
        </a>
    </li>
    <li>
        <a
            href="{% url 'documents:task_list' %}"
            class="findus-nav-link{% if 'task' in request.resolver_match.url_name %} active{% endif %}"
        >
            Aufgaben
        </a>
        <ul class="findus-nav-sublist">
            <li>
                <a
                    href="{% url 'documents:task_template_list' %}"
                    class="findus-nav-link findus-nav-link-sub{% if 'task_template' in request.resolver_match.url_name %} active{% endif %}"
                >
                    Vorlagen
                </a>
            </li>
        </ul>
    </li>
    <li>
        <a
            href="{% url 'documents:correspondent_list' %}"
            class="findus-nav-link{% if 'correspondent' in request.resolver_match.url_name %} active{% endif %}"
        >
        Kontakte
        </a>

        <a
            href="{% url 'documents:vorgang_list' %}"
            class="findus-nav-link{% if 'vorgang' in request.resolver_match.url_name %} active{% endif %}"
        >
            Vorgänge
        </a>

        <a
            href="{% url 'documents:tag_list' %}"
            class="findus-nav-link{% if 'tag' in request.resolver_match.url_name %} active{% endif %}"
        >
            Tags
        </a>
    </li>
    <li>
        <a
            href="{% url 'documents:graph' %}"
            class="findus-nav-link{% if 'graph' in request.resolver_match.url_name %} active{% endif %}"
        >
            Netzwerk
        </a>
    </li>
</ul>
<div class="findus-nav-spacer"></div>
{% if request.user.is_authenticated %}
<div class="findus-user">
    <span class="findus-user-name">{{ request.user }}</span>
    <form method="post" action="{% url 'logout' %}">
        {% csrf_token %}
        <button type="submit" class="btn btn-sm btn-outline-secondary">Logout</button>
    </form>
</div>
{% endif %}
