{% load static %}
<!DOCTYPE html>
<html lang="de" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Findus{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'vendor/bootstrap/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/findus.css' %}">
    <script src="{% static 'vendor/htmx/htmx.min.js' %}" defer></script>
</head>
<body>
    {% csrf_token %}
    <div class="findus-shell">
        {% block nav %}
        <header class="findus-topbar d-lg-none">
            <button
                type="button"
                class="findus-nav-toggle"
                data-bs-toggle="offcanvas"
                data-bs-target="#findus-offcanvas-nav"
                aria-controls="findus-offcanvas-nav"
                aria-label="Navigation öffnen"
            >
                <span class="findus-nav-toggle-bar"></span>
                <span class="findus-nav-toggle-bar"></span>
                <span class="findus-nav-toggle-bar"></span>
            </button>
            <span class="findus-topbar-title">Findus</span>
        </header>

        <div
            class="offcanvas offcanvas-start findus-offcanvas"
            tabindex="-1"
            id="findus-offcanvas-nav"
            aria-labelledby="findus-offcanvas-nav-label"
        >
            <div class="offcanvas-header">
                <span class="visually-hidden" id="findus-offcanvas-nav-label">Navigation</span>
                <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Schließen"></button>
            </div>
            <div class="offcanvas-body findus-nav-body">
                {% include "partials/_nav.html" %}
            </div>
        </div>

        <nav class="findus-sidebar d-none d-lg-flex flex-column" id="findus-nav" aria-label="Hauptnavigation">
            {% include "partials/_nav.html" %}
        </nav>
        {% endblock %}

        <main class="findus-content" id="findus-content">
            {% block content %}{% endblock %}
        </main>
    </div>
    <script src="{% static 'vendor/bootstrap/bootstrap.bundle.min.js' %}" defer></script>
    <script>
        // Attach Django's CSRF token to every HTMX request (GET requests don't
        // need it, but this keeps POST/PUT/DELETE swaps working out of the box).
        document.body.addEventListener("htmx:configRequest", function (event) {
            event.detail.headers["X-CSRFToken"] = document.querySelector(
                "[name=csrfmiddlewaretoken]"
            ).value;
        });
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
